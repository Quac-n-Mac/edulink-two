[package]
name = "edulink-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
edulink-two = { path = ".." }
anyhow = "1"
jni = "0.21"
serde_json = "1"
tokio = { version = "1", features = ["rt", "fs", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
